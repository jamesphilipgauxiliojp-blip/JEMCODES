<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JEMCODES — Cloud Attendance System</title>
<style>
:root{
    --bg:#070c16;
    --bg2:#0b1120;
    --panel:#111a2d;
    --panel2:#141f35;
    --line:#253553;
    --text:#eef3ff;
    --muted:#9aa7c0;
    --primary:#6f8cff;
    --primary2:#5878ff;
    --success:#36d39a;
    --success2:#1a8f66;
    --danger:#ff6b7a;
    --warning:#ffd06d;
    --info:#95bbff;
    --shadow:0 18px 50px rgba(0,0,0,.28);
    --shadow-soft:0 6px 18px rgba(0,0,0,.18);
    --radius:18px;
    --radius-sm:12px;
    --sidebar:270px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    min-height:100vh;
    font:15px/1.5 Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at top left, rgba(111,140,255,.16), transparent 34%),
        radial-gradient(circle at bottom right, rgba(54,211,154,.10), transparent 28%),
        linear-gradient(180deg,var(--bg),var(--bg2));
}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{outline:none}
.hidden{display:none!important}
a{color:inherit}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.full{width:100%}

.brand{
    font-size:30px;
    font-weight:950;
    letter-spacing:-1.6px;
    line-height:1;
}
.brand span{color:var(--primary)}

.btn{
    min-height:44px;
    padding:11px 15px;
    border-radius:12px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-weight:850;
    white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(111,140,255,.22)}
.btn-primary:hover{background:var(--primary2)}
.btn-secondary{background:#182541;color:var(--text);border:1px solid var(--line)}
.btn-success{background:rgba(54,211,154,.14);color:#b8f4d9;border:1px solid rgba(54,211,154,.25)}
.btn-danger{background:rgba(255,107,122,.14);color:#ffb8bf;border:1px solid rgba(255,107,122,.25)}
.btn-warning{background:rgba(255,208,109,.14);color:#ffe5aa;border:1px solid rgba(255,208,109,.22)}
.btn-neutral{background:#202c46;color:var(--text);border:1px solid var(--line)}
.btn-sm{min-height:34px;padding:7px 10px;font-size:12px}
.btn-chip{border-radius:999px;padding:7px 11px}

.card{
    background:linear-gradient(180deg, rgba(20,31,54,.95), rgba(16,25,43,.96));
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    box-shadow:var(--shadow-soft);
}
.section{padding:20px;margin-top:18px}
.section h2{margin:0 0 14px;font-size:18px}

.auth-wrap{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
}
.auth-card{
    width:min(760px,100%);
    padding:32px;
}
.auth-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
}
.auth-subtitle{
    margin:8px 0 0;
    color:var(--muted);
    line-height:1.6;
}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    border-radius:999px;
    background:#182541;
    border:1px solid var(--line);
    color:var(--text);
    font-size:12px;
    font-weight:850;
}
.seg{
    display:flex;
    gap:8px;
    margin:18px 0 10px;
    background:#0f1728;
    padding:6px;
    border-radius:14px;
    border:1px solid var(--line);
}
.seg button{
    flex:1;
    background:transparent;
    color:var(--muted);
    padding:11px 12px;
    border-radius:10px;
    font-weight:900;
}
.seg button.active{
    background:linear-gradient(180deg,var(--primary),var(--primary2));
    color:#fff;
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.wide{grid-column:1/-1}
.field{margin:12px 0}
.field label{
    display:block;
    margin:0 0 7px;
    font-size:12px;
    font-weight:900;
    letter-spacing:.25px;
}
.control{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#0f182b;
    color:var(--text);
}
.control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(111,140,255,.12)}
textarea.control{min-height:110px;resize:vertical}
.helper{
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
}
.err{
    min-height:18px;
    margin-top:8px;
    color:#ff9ba4;
    font-size:13px;
    font-weight:800;
}
.notice{
    padding:13px 14px;
    border-radius:12px;
    background:rgba(111,140,255,.12);
    border:1px solid rgba(111,140,255,.18);
    color:#dbe4ff;
    font-size:13px;
    line-height:1.6;
}
.notice.good{
    background:rgba(54,211,154,.12);
    border-color:rgba(54,211,154,.18);
    color:#bff8d8;
}
.notice.warn{
    background:rgba(255,208,109,.12);
    border-color:rgba(255,208,109,.18);
    color:#ffe0a1;
}

.topbar{
    height:72px;
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 24px;
    background:rgba(8,13,23,.85);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.08);
}
.userbox{display:flex;align-items:center;gap:10px}
.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(180deg,var(--primary),var(--primary2));
    color:#fff;
    font-weight:950;
}

.layout{
    min-height:calc(100vh - 72px);
    display:grid;
    grid-template-columns:var(--sidebar) minmax(0,1fr);
}
.sidebar{
    background:rgba(14,21,37,.94);
    border-right:1px solid rgba(255,255,255,.08);
    padding:16px 12px;
}
.side-title{
    padding:10px;
    color:#7f8ba5;
    font-size:10px;
    font-weight:950;
    letter-spacing:.8px;
    text-transform:uppercase;
}
.nav{
    width:100%;
    text-align:left;
    padding:11px 12px;
    margin:3px 0;
    border-radius:12px;
    background:transparent;
    color:#b5c0d8;
    font-weight:800;
}
.nav:hover,.nav.active{
    background:#1a2742;
    color:#fff;
}
.nav-badge{
    float:right;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(255,107,122,.14);
    color:#ffb8bf;
    font-size:10px;
    font-weight:900;
}
.main{
    max-width:1600px;
    width:100%;
    margin:0 auto;
    padding:28px;
}
.page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
    margin-bottom:22px;
}
.page-head h1{
    margin:0 0 6px;
    font-size:30px;
    line-height:1.15;
}
.page-head p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.stat{padding:18px}
.stat small{display:block;color:var(--muted);font-weight:800}
.stat b{display:block;font-size:30px;margin-top:4px}
.stat span{display:block;font-size:11px;color:var(--muted)}

.room{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding:18px;
    margin-bottom:10px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);
    background:#111b30;
}
.room:last-child{margin-bottom:0}
.room-name{font-size:17px;font-weight:950}
.room-desc{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
.room-code{
    font-size:22px;
    letter-spacing:4px;
    font-weight:1000;
    color:#dbe4ff;
}
.room-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    font-size:10px;
    font-weight:900;
}
.badge-present,.badge-joined,.badge-active,.badge-exempted,.badge-approved{
    color:#bff8d8;
    background:rgba(54,211,154,.14);
}
.badge-absent,.badge-declined,.badge-closed{
    color:#ffb8bf;
    background:rgba(255,107,122,.14);
}
.badge-pending{color:#dbe4ff;background:rgba(111,140,255,.14)}
.badge-not{color:#d6dce7;background:rgba(255,255,255,.06)}

.table-wrap{overflow:auto}
.table{
    width:100%;
    min-width:760px;
    border-collapse:collapse;
}
.table th{
    text-align:left;
    padding:12px 10px;
    color:#8290ab;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.45px;
    border-bottom:1px solid rgba(255,255,255,.08);
}
.table td{
    padding:13px 10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:13px;
    vertical-align:middle;
}
.table tr:hover td{background:rgba(255,255,255,.03)}

.empty{
    text-align:center;
    color:var(--muted);
    padding:34px 16px;
}
.empty b{display:block;color:var(--text);margin-top:5px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.search{max-width:380px}
.tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:16px;
}
.tab{
    padding:10px 13px;
    background:transparent;
    color:var(--muted);
    font-weight:900;
    border-radius:12px 12px 0 0;
}
.tab.active{
    color:#fff;
    background:#1a2742;
    border-bottom:2px solid var(--primary);
}
.info,.warn,.good{
    padding:13px 14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.6;
}
.info{background:rgba(111,140,255,.12);border:1px solid rgba(111,140,255,.18);color:#dbe4ff}
.warn{background:rgba(255,208,109,.12);border:1px solid rgba(255,208,109,.18);color:#ffe0a1}
.good{background:rgba(54,211,154,.12);border:1px solid rgba(54,211,154,.18);color:#bff8d8}
.progress{
    height:8px;
    background:#1a2742;
    border-radius:999px;
    overflow:hidden;
}
.progress > i{
    display:block;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--primary),var(--success));
}
.timeline{position:relative;padding-left:24px}
.timeline:before{
    content:"";
    position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:#26365a;
}
.event{position:relative;padding:0 0 16px}
.event:before{
    content:"";
    position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;
    background:var(--primary);
    border:3px solid #1a2742;
}
.event b{font-size:13px}
.event small{display:block;color:var(--muted);margin-top:3px}

.modal{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;
    padding:20px;
    background:rgba(2,7,18,.72);
}
.modal-box{
    width:min(760px,100%);
    max-height:90vh;
    overflow:auto;
    padding:24px;
    background:linear-gradient(180deg,#121c31,#0f1729);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    box-shadow:var(--shadow);
}
.modal-head{
    display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px
}
.modal-head h2{margin:0}
.close{width:34px;height:34px;border-radius:50%;background:#1f2a44;color:var(--text)}
.toast{
    position:fixed;
    right:20px;bottom:20px;z-index:200;
    padding:13px 16px;
    background:#09111f;
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    box-shadow:var(--shadow);
    max-width:360px;
    font-size:13px;
    font-weight:800;
}
.avatar-lg{
    width:64px;height:64px;border-radius:18px;
    display:grid;place-items:center;
    background:#0f182b;
    color:#dbe4ff;
    font-size:22px;font-weight:1000;
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.wide{grid-column:1/-1}
hr.sep{border:0;border-top:1px solid rgba(255,255,255,.08);margin:18px 0}
.small-muted{font-size:12px;color:var(--muted)}
.code-large{
    font-size:44px;
    letter-spacing:8px;
    font-weight:1000;
    text-align:center;
    padding:18px;
    border-radius:16px;
    background:#0f182b;
    border:1px solid var(--line);
    color:#dbe4ff;
}
.file-drop{
    border:2px dashed #2b3c61;
    border-radius:16px;
    padding:22px;
    background:#0f182b;
}
.kpi-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}
.kpi{
    padding:17px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    background:#111b30;
}
.kpi-label{
    display:block;
    margin-top:9px;
    font-size:11px;
    color:#7b8492;
    font-weight:850;
    text-transform:uppercase;
}
.kpi-value{
    display:block;
    margin-top:3px;
    font-size:26px;
    font-weight:950;
    letter-spacing:-0.8px;
}
.kpi-icon{font-size:20px}
.stat-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:9px 0;
    font-size:12px;
}
.stat-row strong{font-size:13px}

@media(max-width:1280px){
    .grid-4,.kpi-grid{grid-template-columns:repeat(3,1fr)}
    .grid-2{grid-template-columns:1fr}
}
@media(max-width:800px){
    .layout{grid-template-columns:1fr}
    .sidebar{
        display:flex;
        overflow:auto;
        gap:4px;
        padding:8px;
        position:sticky;
        top:72px;
        z-index:30;
    }
    .side-title{display:none}
    .nav{white-space:nowrap;width:auto}
    .main{padding:16px}
    .page-head{flex-direction:column}
    .room{align-items:flex-start;flex-direction:column}
    .room-actions{justify-content:flex-start}
    .grid-4,.grid-3,.grid-2,.form-grid,.kpi-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   JEMCODES CLOUD ATTENDANCE SYSTEM
   =========================================================
   Purpose:
   - GitHub Pages frontend
   - Supabase backend for shared accounts + shared rooms
   - Dark theme by default
   - Separate Sign In / Log In buttons
   - Teacher/Boss dashboards
   - Student/Worker dashboards
   - Shared class codes that work across browsers
   ========================================================= */

/* ---------------- CONFIG ---------------- */
const LOCAL_SETTINGS_KEY = "jemcodes_local_settings_v1";
const LOCAL_UI_KEY = "jemcodes_ui_v1";

// =========================================================
// JEMCODES ONE-TIME OWNER CONFIGURATION
// The Project URL is already built in. Replace ONLY the
// placeholder publishable key below once before uploading to
// GitHub Pages. Do NOT use a secret/service_role key.
// =========================================================
const JEMCODES_SUPABASE_URL = "https://neblaxojmjgkzkmrscdl.supabase.co";
const JEMCODES_SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
// After this one-time owner setup, every browser connects automatically.
// The publishable key is intended for browser apps; never put a secret/service_role key here.

const DEFAULT_SETTINGS = {
    supabaseUrl: JEMCODES_SUPABASE_URL,
    supabaseAnonKey: JEMCODES_SUPABASE_PUBLISHABLE_KEY,
    appName: "JEMCODES"
};

let localSettings = loadLocalSettings();

let supabaseClient = null;
let session = null;
let currentUser = null;
let authMode = "signup";
let currentPage = "dashboard";
let activeRoomId = null;
let toastTimer = null;
let realtimeChannel = null;

/* ---------------- DOM SHORTCUTS ---------------- */
const $ = (selector) => document.querySelector(selector);

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char]));
}

function uid(prefix = "id") {
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function now() {
    return new Date().toISOString();
}

function fmt(value) {
    return value ? new Date(value).toLocaleString() : "—";
}

function initials(name) {
    return String(name || "U")
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
}

function roleLabel(role) {
    return {
        student: "Student",
        worker: "Worker",
        teacher: "Teacher",
        boss: "Boss"
    }[role] || role || "User";
}

function roleIcon(role) {
    return {
        student: "🎓",
        worker: "🧰",
        teacher: "📚",
        boss: "🏢"
    }[role] || "👤";
}

function slugStatus(value) {
    return String(value ?? "").toLowerCase().replace(/\s+/g, "_");
}

function formatStatus(value) {
    const s = String(value || "");
    if (s === "present") return "Present";
    if (s === "absent") return "Absent";
    if (s === "exempted") return "Exempted";
    if (s === "pending") return "Pending";
    return "Not Marked";
}

function badge(status) {
    const value = formatStatus(status);
    const key = value.toLowerCase().replace(/\s+/g, "-");
    let cls = "badge-not";
    if (key === "present" || key === "joined" || key === "active") cls = "badge-present";
    else if (key === "approved" || key === "exempted") cls = "badge-exempted";
    else if (key === "absent" || key === "declined" || key === "closed") cls = "badge-absent";
    else if (key === "pending") cls = "badge-pending";
    return `<span class="badge ${cls}">${escapeHTML(value)}</span>`;
}

function progress(percent) {
    const p = Math.max(0, Math.min(100, Number(percent) || 0));
    return `<div class="progress"><i style="width:${p}%"></i></div>`;
}

function statCard(label, value, sub) {
    return `<div class="card stat"><small>${escapeHTML(label)}</small><b>${escapeHTML(value)}</b><span>${escapeHTML(sub)}</span></div>`;
}

function emptyState(icon, title, message) {
    return `
        <div class="empty">
            <div style="font-size:30px">${icon}</div>
            <b>${escapeHTML(title)}</b>
            <div>${escapeHTML(message)}</div>
        </div>
    `;
}

function toast(message) {
    const node = document.getElementById("toast");
    node.textContent = message;
    node.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.add("hidden"), 3000);
}

function openModal(title, content) {
    const root = document.getElementById("modalRoot");
    root.innerHTML = `
        <div class="modal" onclick="closeModalBg(event)">
            <div class="modal-box">
                <div class="modal-head">
                    <h2>${escapeHTML(title)}</h2>
                    <button class="close" onclick="closeModal()">×</button>
                </div>
                ${content}
            </div>
        </div>
    `;
    root.classList.remove("hidden");
}

function closeModal() {
    const root = document.getElementById("modalRoot");
    root.classList.add("hidden");
    root.innerHTML = "";
}

function closeModalBg(e) {
    if (e.target.classList.contains("modal")) closeModal();
}

/* ---------------- LOCAL SETTINGS ---------------- */
function loadLocalSettings() {
    try {
        const raw = localStorage.getItem(LOCAL_SETTINGS_KEY);
        if (!raw) return structuredClone(DEFAULT_SETTINGS);
        const saved = JSON.parse(raw);
        return { ...structuredClone(DEFAULT_SETTINGS), ...saved,
            supabaseUrl: saved.supabaseUrl || JEMCODES_SUPABASE_URL,
            supabaseAnonKey: saved.supabaseAnonKey || JEMCODES_SUPABASE_PUBLISHABLE_KEY
        };
    } catch {
        return structuredClone(DEFAULT_SETTINGS);
    }
}

function saveLocalSettings() {
    localStorage.setItem(LOCAL_SETTINGS_KEY, JSON.stringify(localSettings));
}

function saveUiMode(mode) {
    localStorage.setItem(LOCAL_UI_KEY, JSON.stringify({ authMode: mode }));
}

function loadUiMode() {
    try {
        const raw = localStorage.getItem(LOCAL_UI_KEY);
        if (!raw) return "signup";
        const parsed = JSON.parse(raw);
        return parsed.authMode || "signup";
    } catch {
        return "signup";
    }
}

/* ---------------- SUPABASE ---------------- */
function ensureSupabaseClient() {
    const url = (JEMCODES_SUPABASE_URL || localSettings.supabaseUrl || "").trim();
    const key = (JEMCODES_SUPABASE_PUBLISHABLE_KEY && JEMCODES_SUPABASE_PUBLISHABLE_KEY !== "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE"
        ? JEMCODES_SUPABASE_PUBLISHABLE_KEY
        : (localSettings.supabaseAnonKey || "")).trim();

    if (!url || !key) {
        supabaseClient = null;
        return null;
    }

    if (!window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return null;
    }

    if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(url, key, {
            auth: {
                persistSession: true,
                autoRefreshToken: true
            }
        });
    }

    return supabaseClient;
}

async function getSessionAndUser() {
    const sb = ensureSupabaseClient();
    if (!sb) return { session: null, user: null };

    const { data: sessionData } = await sb.auth.getSession();
    const activeSession = sessionData?.session || null;

    if (!activeSession) return { session: null, user: null };

    const { data: userData } = await sb.auth.getUser();
    return {
        session: activeSession,
        user: userData?.user || null
    };
}

async function signOut() {
    const sb = ensureSupabaseClient();
    if (sb) {
        try {
            await sb.auth.signOut();
        } catch {}
    }
    session = null;
    currentUser = null;
    activeRoomId = null;
    stopRealtime();
    renderAuth();
}

function startRealtime() {
    const sb = ensureSupabaseClient();
    if (!sb || !currentUser) return;

    stopRealtime();

    realtimeChannel = sb
        .channel("jemcodes-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, refreshCurrentView)
        .on("postgres_changes", { event: "*", schema: "public", table: "rooms" }, refreshCurrentView)
        .on("postgres_changes", { event: "*", schema: "public", table: "room_members" }, refreshCurrentView)
        .on("postgres_changes", { event: "*", schema: "public", table: "attendance" }, refreshCurrentView)
        .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, refreshCurrentView)
        .on("postgres_changes", { event: "*", schema: "public", table: "notifications" }, refreshCurrentView)
        .on("postgres_changes", { event: "*", schema: "public", table: "reports" }, refreshCurrentView)
        .subscribe();
}

function stopRealtime() {
    if (realtimeChannel && supabaseClient) {
        try {
            supabaseClient.removeChannel(realtimeChannel);
        } catch {}
    }
    realtimeChannel = null;
}

function refreshCurrentView() {
    if (!currentUser) return;
    renderApp();
}

function getFormValues() {
    return {
        fullName: document.getElementById("fullName")?.value.trim() || "",
        password: document.getElementById("password")?.value || "",
        role: document.getElementById("role")?.value || "",
        username: document.getElementById("username")?.value.trim() || ""

}

// Supabase Auth still needs an internal email-shaped identifier for
// password authentication. Users NEVER see or enter this identifier.
function internalAuthEmail(username) {
    const clean = String(username || "").trim().toLowerCase();
    return clean.replace(/[^a-z0-9._-]/g, "_") + "@auth.jemcodes.local";
}

async function handleSignup(event) {
    event.preventDefault();
    const error = document.getElementById("authError");
    error.textContent = "";

    const { fullName, password, role, username } = getFormValues();

    if (fullName.length < 2) return error.textContent = "Enter your real/full name.";
    if (password.length < 6) return error.textContent = "Password must be at least 6 characters.";
    if (!role) return error.textContent = "Select your account category.";
    if (username.length < 3) return error.textContent = "Username must be at least 3 characters.";

    const sb = ensureSupabaseClient();
    if (!sb) {
        error.textContent = "JEMCODES cloud configuration is missing. The owner must add the publishable key once in index.html.";
        return;
    }

    const authEmail = internalAuthEmail(username);
    const { data, error: authError } = await sb.auth.signUp({
        email: authEmail,
        password,
        options: {
            data: {
                full_name: fullName,
                username,
                role
            }
        }
    });

    if (authError) {
        error.textContent = authError.message;
        return;
    }

    const userId = data.user?.id;
    if (!userId) {
        error.textContent = "Account creation did not return a user ID.";
        return;
    }

    // The Supabase trigger in the JEMCODES SQL creates the matching
    // public.profiles row from the Auth metadata.
    if (!data.session) {
        error.textContent = "Account was created but Supabase is waiting for email confirmation. Turn OFF Confirm email in Supabase Auth → Email, then create the account again.";
        return;
    }

    toast("Account created successfully.");
    await bootstrapSession();
}

async function handleLogin(event) {
    event.preventDefault();
    const error = document.getElementById("authError");
    error.textContent = "";

    const { fullName, password, role, username } = getFormValues();

    if (fullName.length < 2) return error.textContent = "Enter your real/full name.";
    if (username.length < 3) return error.textContent = "Enter your username.";
    if (password.length < 6) return error.textContent = "Enter your password.";
    if (!role) return error.textContent = "Select your account category.";

    const sb = ensureSupabaseClient();
    if (!sb) {
        error.textContent = "JEMCODES cloud configuration is missing. The owner must add the publishable key once in index.html.";
        return;
    }

    const { data, error: authError } = await sb.auth.signInWithPassword({
        email: internalAuthEmail(username),
        password
    });

    if (authError) {
        error.textContent = authError.message;
        return;
    }

    const userId = data.user?.id;
    if (!userId) {
        error.textContent = "Login succeeded, but no user ID was returned.";
        return;
    }

    const { data: profileData, error: profileError } = await sb
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();

    if (profileError) {
        error.textContent = profileError.message;
        return;
    }

    if (profileData && profileData.role !== role) {
        error.textContent = "Account category does not match this login.";
        return;
    }

    if (profileData) {
        const patch = {
            full_name: fullName || profileData.full_name,
            username: username || profileData.username,
            role,
            updated_at: now()
        };
        const { error: updateError } = await sb.from("profiles").update(patch).eq("id", userId);
        if (updateError) {
            error.textContent = updateError.message;
            return;
        }
    }

    toast("Logged in successfully.");
    await bootstrapSession();
}

/* ---------------- BOOTSTRAP ---------------- */
async function bootstrapSession() {
    const sb = ensureSupabaseClient();

    if (!sb) {
        renderAuth();
        return;
    }

    const { session: s, user: u } = await getSessionAndUser();
    session = s;
    currentUser = u ? await loadCurrentProfile(u.id) : null;

    if (!currentUser) {
        renderAuth();
        return;
    }

    startRealtime();
    currentPage = "dashboard";
    renderApp();
}

async function loadCurrentProfile(userId) {
    const sb = ensureSupabaseClient();
    if (!sb) return null;

    const { data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
    if (error || !data) return null;
    return data;
}

/* ---------------- ROUTING ---------------- */
async function go(route) {
    currentPage = route;
    if (!currentUser) {
        renderAuth();
        return;
    }

    document.querySelectorAll(".nav").forEach(btn => btn.classList.toggle("active", btn.dataset.page === route));

    if (route === "dashboard") return isManager() ? renderManagerDashboard() : renderUserDashboard();
    if (route === "rooms") return isManager() ? renderRoomsPage() : renderUserDashboard();
    if (route === "members") return renderMembersPage();
    if (route === "requests") return isManager() ? renderManagerRequests() : renderMyRequests();
    if (route === "attendance") return isManager() ? renderManagerAttendance() : renderMyAttendance();
    if (route === "reports") return renderReportsPage();
    if (route === "join") return renderJoinRoomPage();
    if (route === "notifications") return renderNotificationsPage();
    if (route === "settings") return renderSettingsPage();
    if (route === "schema") return renderSchemaPage();
    return renderManagerDashboard();
}

/* ---------------- SUPABASE HELPERS ---------------- */
async function sbSelect(table, queryBuilder = q => q) {
    const sb = ensureSupabaseClient();
    const q = queryBuilder(sb.from(table).select("*"));
    const { data, error } = await q;
    if (error) throw error;
    return data || [];
}
async function sbMaybeSingle(table, builder) {
    const sb = ensureSupabaseClient();
    const q = builder(sb.from(table).select("*"));
    const { data, error } = await q.maybeSingle();
    if (error) throw error;
    return data || null;
}
async function sbInsert(table, payload) {
    const sb = ensureSupabaseClient();
    const { error } = await sb.from(table).insert(payload);
    if (error) throw error;
}
async function sbUpsert(table, payload) {
    const sb = ensureSupabaseClient();
    const { error } = await sb.from(table).upsert(payload);
    if (error) throw error;
}
async function sbUpdate(table, payload, filterBuilder) {
    const sb = ensureSupabaseClient();
    const q = filterBuilder(sb.from(table).update(payload));
    const { error } = await q;
    if (error) throw error;
}
async function sbDelete(table, filterBuilder) {
    const sb = ensureSupabaseClient();
    const q = filterBuilder(sb.from(table).delete());
    const { error } = await q;
    if (error) throw error;
}

/* ---------------- DATA FETCH ---------------- */
async function loadOwnedRooms() {
    return await sbSelect("rooms", q => q.eq("owner_id", currentUser.id).order("created_at", { ascending: false }));
}
async function loadJoinedRooms() {
    return await sbSelect("room_members", q => q.eq("user_id", currentUser.id));
}
async function loadAllJoinedRoomIds() {
    const rows = await loadJoinedRooms();
    return rows.map(row => row.room_id);
}
async function loadRoomsByIds(roomIds) {
    if (!roomIds.length) return [];
    return await sbSelect("rooms", q => q.in("id", roomIds).order("created_at", { ascending: false }));
}
async function loadMyAttendance() {
    return await sbSelect("attendance", q => q.eq("user_id", currentUser.id).order("updated_at", { ascending: false }));
}
async function loadMyRequests() {
    return await sbSelect("requests", q => q.eq("user_id", currentUser.id).order("created_at", { ascending: false }));
}
async function loadManagerRequests(roomIds) {
    if (!roomIds.length) return [];
    return await sbSelect("requests", q => q.in("room_id", roomIds).order("created_at", { ascending: false }));
}
async function loadNotifications() {
    return await sbSelect("notifications", q => q.eq("user_id", currentUser.id).order("created_at", { ascending: false }));
}
async function loadProfilesByIds(ids) {
    if (!ids.length) return [];
    return await sbSelect("profiles", q => q.in("id", ids));
}

            <div class="kpi"><span class="kpi-icon">✅</span><span class="kpi-label">PRESENT</span><span class="kpi-value">${present}</span></div>
            <div class="kpi"><span class="kpi-icon">❌</span><span class="kpi-label">ABSENT</span><span class="kpi-value">${absent}</span></div>
            <div class="kpi"><span class="kpi-icon">🟢</span><span class="kpi-label">EXEMPTED</span><span class="kpi-value">${exempted}</span></div>
            <div class="kpi"><span class="kpi-icon">⏳</span><span class="kpi-label">PENDING</span><span class="kpi-value">${pending}</span></div>

async function loadRecentManagerAudit(roomIds) {
    if (!roomIds.length) return [];
    const rows = await sbSelect("audit", q => q.in("room_id", roomIds).order("created_at", { ascending: false }).limit(10));
    return rows;
}

function renderRecentAudit(rows) {
    if (!rows.length) return `<div class="muted">No activity yet.</div>`;
    return rows.map(row => `
        <div class="event">
            <b>${escapeHTML(row.action.replaceAll("_", " "))}</b>
            <small>${escapeHTML(row.detail || "")} · ${fmt(row.created_at)}</small>
        </div>
    `).join("");
}

/* ---------------- RENDER HELPERS ---------------- */
function renderManagerRoomMini(room, attendance, requests, profileMap) {
    const memberCount = attendance.filter(a => a.room_id === room.id || a.roomId === room.id).length;
    const completion = attendance.length ? Math.round((attendance.filter(a => a.room_id === room.id || a.roomId === room.id).filter(a => a.status !== "not_marked").length / Math.max(1, attendance.filter(a => a.room_id === room.id || a.roomId === room.id).length)) * 100) : 0;

    return `
        <div class="room">
            <div>
                <div class="room-name">${escapeHTML(room.name)}</div>
                <div class="room-desc">${escapeHTML(room.description || "No description")} · ${room.active ? "Open" : "Closed"} · ${memberCount} record(s)</div>
            </div>
            <div class="room-actions">
                <div class="room-code">${escapeHTML(room.code)}</div>
                ${badge(room.active ? "Active" : "Closed")}
                <button class="btn btn-secondary btn-sm" onclick="openRoom('${room.id}')">Manage</button>
                <button class="btn btn-neutral btn-sm" onclick="copyRoomCode('${room.code}')">Copy</button>
            </div>
        </div>
        <div style="margin:-2px 0 14px 0">${progress(completion)}</div>
    `;
}

function renderUserRoomList(rooms, attendance, requests) {
    return rooms.map(room => {
        const att = attendance.find(a => a.room_id === room.id || a.roomId === room.id) || null;
        const pending = requests.find(r => r.room_id === room.id || r.roomId === room.id);
        const status = att ? formatStatus(att.status) : pending ? "Pending" : "Not Marked";
        return `
            <div class="room">
                <div>
                    <div class="room-name">${escapeHTML(room.name)}</div>
                    <div class="room-desc">Room code: <b>${escapeHTML(room.code)}</b></div>
                </div>
                <div class="room-actions">
                    ${badge(status)}
                    <button class="btn btn-success btn-sm" onclick="markSelfPresent('${room.id}')">Present</button>
                    <button class="btn btn-danger btn-sm" onclick="openAbsenceModal('${room.id}')">Absent</button>
                </div>
            </div>
        `;
    }).join("");
}

async function createRoom() {
    const name = $("#roomName").value.trim();
    const description = $("#roomDesc").value.trim();
    const visibility = $("#roomVisibility").value;
    const defaultMark = $("#roomDefault").value;

    if (name.length < 2) return toast("Enter a valid room name.");

    const room = {
        id: uid("room"),
        owner_id: currentUser.id,
        name,
        description,
        code: await uniqueRoomCode(),
        active: true,
        visibility,
        default_mark: defaultMark,
        created_at: now(),
        updated_at: now()
    };

    const { error } = await sbInsert("rooms", room);
    if (error) return toast(error.message);

    await sbInsert("audit", {
        id: uid("audit"),
        user_id: currentUser.id,
        action: "ROOM_CREATED",
        detail: name,
        created_at: now(),
        room_id: room.id
    });

    closeModal();
    toast(`Room created. Code: ${room.code}`);
    go("rooms");
}

async function uniqueRoomCode() {
    let code = "";
    let exists = true;
    while (exists) {
        code = String(Math.floor(100000 + Math.random() * 900000));
        const { data } = await sbSelect("rooms", q => q.eq("code", code).limit(1));
        exists = data.length > 0;
    }
    return code;
}

async function submitAbsence(roomId) {
    const reason = $("#absReason").value.trim();
    const err = $("#absErr");
    const room = await sbMaybeSingle("rooms", q => q.eq("id", roomId));

    err.textContent = "";

    if (reason.length < 5) return err.textContent = "Please provide a more detailed reason.";
    if (!room) return err.textContent = "Room not found.";

    const pending = await sbMaybeSingle("requests", q => q.eq("room_id", roomId).eq("user_id", currentUser.id).eq("status", "pending"));
    if (pending) return err.textContent = "You already have a pending request.";

    const request = {
        id: uid("req"),
        room_id: roomId,
        user_id: currentUser.id,
        reason,
        status: "pending",
        created_at: now(),
        decided_at: null
    };

    await sbInsert("requests", request);

    const att = await sbMaybeSingle("attendance", q => q.eq("room_id", roomId).eq("user_id", currentUser.id));
    if (att) {
        await sbUpdate("attendance", { status: "pending", reason, updated_at: now(), source: "request" }, q => q.eq("id", att.id));
    } else {
        await sbInsert("attendance", {
            id: uid("att"),
            room_id: roomId,
            user_id: currentUser.id,
            status: "pending",
            reason,
            created_at: now(),
            updated_at: now(),
            source: "request"
        });

    await sbInsert("notifications", {
        id: uid("note"),
        user_id: room.owner_id,
        title: "New absence request",
        message: `${currentUser.full_name} submitted an absence request for ${room.name}.`,
        read: false,
        created_at: now(),
        room_id: roomId
    });

    await sbInsert("audit", {
        id: uid("audit"),
        user_id: currentUser.id,
        action: "ABSENCE_REQUEST_SENT",
        detail: `${room.name}: ${reason}`,
        created_at: now(),
        room_id: roomId
    });

    closeModal();
    toast("Absence request sent.");
    renderUserDashboard();
}

async function decideRequest(requestId, decision) {
    const req = await sbMaybeSingle("requests", q => q.eq("id", requestId));
    if (!req || req.status !== "pending") return;

    const room = await sbMaybeSingle("rooms", q => q.eq("id", req.room_id));
    const finalStatus = decision === "approved" ? "approved" : "declined";
    const attendanceStatus = finalStatus === "approved" ? "exempted" : "absent";

    await sbUpdate("requests", {
        status: finalStatus,
        decided_at: now()
    }, q => q.eq("id", requestId));

    const attendance = await sbMaybeSingle("attendance", q => q.eq("room_id", req.room_id).eq("user_id", req.user_id));
    if (attendance) {
        await sbUpdate("attendance", {
            status: attendanceStatus,
            updated_at: now(),
            source: "manager_request"
        }, q => q.eq("id", attendance.id));
    } else {
        await sbInsert("attendance", {
            id: uid("att"),
            room_id: req.room_id,
            user_id: req.user_id,
            status: attendanceStatus,
            reason: req.reason,
            created_at: now(),
            updated_at: now(),
            source: "manager_request"
        });
    }

    await sbInsert("notifications", {
        id: uid("note"),
        user_id: req.user_id,
        title: "Absence Request Decision",
        message: `${room?.name || "Room"}: your request was ${finalStatus === "approved" ? "approved and marked Exempted" : "declined and marked Absent"}.`,
        read: false,
        created_at: now(),
        room_id: req.room_id
    });

    await sbInsert("audit", {
        id: uid("audit"),
        user_id: currentUser.id,
        action: "REQUEST_DECIDED",
        detail: `${room?.name || "Room"} → ${finalStatus}`,
        created_at: now(),
        room_id: req.room_id
    });

    toast(`Request updated: ${finalStatus === "approved" ? "Exempted" : "Absent"}.`);
    renderManagerRequests();
}

async function renderManagerAttendance() {
    const rooms = await loadOwnedRooms();
    const roomIds = rooms.map(r => r.id);
    const attendance = roomIds.length ? await sbSelect("attendance", q => q.in("room_id", roomIds).order("updated_at", { ascending: false })) : [];
    const roomMembers = roomIds.length ? await sbSelect("room_members", q => q.in("room_id", roomIds)) : [];
    const profiles = await loadProfilesByIds([...new Set(roomMembers.map(m => m.user_id))]);
    const profileMap = new Map(profiles.map(p => [p.id, p]));

    const rows = roomMembers.map(m => {
        const room = rooms.find(r => r.id === m.room_id);
        const profile = profileMap.get(m.user_id);
        const att = attendance.find(a => a.room_id === m.room_id && a.user_id === m.user_id);
        return {
            room,
            memberId: m.user_id,
            profile,
            att

async function setManagerAttendance(roomId, userId, status) {
    const room = await sbMaybeSingle("rooms", q => q.eq("id", roomId));
    const profile = await sbMaybeSingle("profiles", q => q.eq("id", userId));
    if (!room || !profile) return;

    const att = await sbMaybeSingle("attendance", q => q.eq("room_id", roomId).eq("user_id", userId));
    if (att) {
        await sbUpdate("attendance", { status, updated_at: now(), source: "manager" }, q => q.eq("id", att.id));
    } else {
        await sbInsert("attendance", {
            id: uid("att"),
            room_id: roomId,
            user_id: userId,
            status,
            created_at: now(),
            updated_at: now(),
            source: "manager"
        });
    }

    await sbInsert("notifications", {
        id: uid("note"),
        user_id: userId,
        title: "Attendance Updated",
        message: `${room.name}: you were marked ${formatStatus(status)}.`,
        read: false,
        created_at: now(),
        room_id: roomId
    });

    await sbInsert("audit", {
        id: uid("audit"),
        user_id: currentUser.id,
        action: "ATTENDANCE_SET",
        detail: `${profile.full_name} in ${room.name} → ${status}`,
        created_at: now(),
        room_id: roomId
    });

    toast(`Updated ${profile.full_name} to ${formatStatus(status)}.`);
    openRoom(roomId);
}

async function bulkSet(roomId, status) {
    const room = await sbMaybeSingle("rooms", q => q.eq("id", roomId));
    const members = await sbSelect("room_members", q => q.eq("room_id", roomId));
    if (!room || !members.length) return toast("No members in this room.");
    if (!confirm(`Mark all ${members.length} members as ${formatStatus(status)}?`)) return;

    for (const m of members) {
        const att = await sbMaybeSingle("attendance", q => q.eq("room_id", roomId).eq("user_id", m.user_id));
        if (att) {
            await sbUpdate("attendance", { status, updated_at: now(), source: "bulk" }, q => q.eq("id", att.id));
        } else {
            await sbInsert("attendance", {
                id: uid("att"),
                room_id: roomId,
                user_id: m.user_id,
                status,
                created_at: now(),
                updated_at: now(),
                source: "bulk"
            });
        }

        await sbInsert("notifications", {
            id: uid("note"),
            user_id: m.user_id,
            title: "Bulk Attendance Update",
            message: `${room.name}: your attendance was marked ${formatStatus(status)}.`,
            read: false,
            created_at: now(),
            room_id: roomId
        });
    }

    await sbInsert("audit", {
        id: uid("audit"),
        user_id: currentUser.id,
        action: "BULK_ATTENDANCE",
        detail: `${room.name}: ${status}`,
        created_at: now(),
        room_id: roomId
    });

    toast("Bulk attendance completed.");
    openRoom(roomId);
}

function roomFromMap(roomId) {

async function reportRows() {
    const rooms = await loadOwnedRooms();
    const roomIds = rooms.map(r => r.id);
    const members = roomIds.length ? await sbSelect("room_members", q => q.in("room_id", roomIds)) : [];
    const attendance = roomIds.length ? await sbSelect("attendance", q => q.in("room_id", roomIds)) : [];
    const ids = [...new Set(members.map(m => m.user_id))];
    const profiles = await loadProfilesByIds(ids);
    const profileMap = new Map(profiles.map(p => [p.id, p]));
    const roomMap = new Map(rooms.map(r => [r.id, r]));

    const rows = members.map(m => {
        const p = profileMap.get(m.user_id);
        const att = attendance.find(a => a.room_id === m.room_id && a.user_id === m.user_id);
        return {
            roomId: m.room_id,
            room: roomMap.get(m.room_id)?.name || "Unknown",
            accountId: m.user_id,
            name: p?.full_name || "Unknown",
            username: p?.username || "",
            role: p?.role || "",
            status: att ? formatStatus(att.status) : "Not Marked"
        };
    });

    return rows;
}

function renderSimpleBarChart(savedReports = []) {
    const days = [];
    for (let i = 13; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dayKey = date.toISOString().slice(0, 10);
        days.push({
            label: date.toLocaleDateString(undefined, { month: "short", day: "numeric" }),
            count: savedReports.filter(r => String(r.created_at || "").startsWith(dayKey)).length
        });
    }
    const max = Math.max(...days.map(d => d.count), 1);
    return `
        <div class="grid-4" style="gap:8px;align-items:end;height:220px">
            ${days.map(day => `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:200px">
                    <div style="width:100%;height:${Math.max(10,(day.count/max)*150)}px;background:linear-gradient(180deg,var(--primary),var(--success));border-radius:10px 10px 3px 3px;position:relative">
                        <span style="position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900">${day.count}</span>
                    </div>
                    <div style="font-size:10px;color:var(--muted);margin-top:8px;text-align:center">${day.label}</div>
                </div>
            `).join("")}
        </div>
    `;
}

/* ---------------- PROFILE / CONNECTION ---------------- */
function saveConnection() {
    localSettings.supabaseUrl = JEMCODES_SUPABASE_URL;
    localSettings.supabaseAnonKey = JEMCODES_SUPABASE_PUBLISHABLE_KEY;
    saveLocalSettings();
    supabaseClient = null;
    ensureSupabaseClient();
    toast("Supabase connection saved.");
}

async function testConnection() {
    const sb = ensureSupabaseClient();
    if (!sb) {
        toast("Add a Supabase URL and anon key first.");
        return;
    }
    const { data, error } = await sb.from("profiles").select("id").limit(1);
    if (error) {
        toast(error.message);
        return;
    }
    toast("Connection works.");
}

async function saveProfile() {
    const name = $("#profileName").value.trim();
    if (name.length < 2) return toast("Full name cannot be empty.");

    const { error } = await sbUpdate("profiles", {
        full_name: name,
        updated_at: now()
    }, q => q.eq("id", currentUser.id));

    if (error) return toast(error.message);
    currentUser.full_name = name;
    toast("Profile updated.");
    renderApp();
}

async function changePassword() {
    const newPassword = $("#newPassword").value;
    const confirmPassword = $("#confirmPassword").value;
    if (newPassword.length < 6) return toast("Password must be at least 6 characters.");
    if (newPassword !== confirmPassword) return toast("Passwords do not match.");

    const sb = ensureSupabaseClient();
    if (!sb) return toast("JEMCODES cloud is configured automatically.");

    const { error } = await sb.auth.updateUser({ password: newPassword });
    if (error) return toast(error.message);

    toast("Password updated.");
}

function backupData() {
    const payload = {
        app: "JEMCODES",
        exportedAt: now(),
        localSettings,
        ui: { authMode }
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `JEMCODES_Local_Settings_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Backup exported.");
}

function clearConnection() {
    if (!confirm("Clear the saved Supabase connection from this browser?")) return;
    localSettings = structuredClone(DEFAULT_SETTINGS);
    saveLocalSettings();
    supabaseClient = null;
    toast("Local connection cleared.");
    renderSettingsPage();
}

async function restoreBackup() {
    const file = $("#restoreFile").files[0];
    if (!file) return toast("Choose a backup file first.");

    const text = await file.text();
    try {
        const parsed = JSON.parse(text);
        if (!parsed.localSettings) throw new Error("Invalid backup");
        localSettings = { ...structuredClone(DEFAULT_SETTINGS), ...parsed.localSettings };
        saveLocalSettings();
        toast("Backup restored.");
        renderSettingsPage();
    } catch {
        toast("Could not restore that file.");
    }
}

function renderRoomSettings(room) {
    return `
        <h2>Room Settings</h2>
        <div class="form-grid">
            <div class="wide field">
                <label>ROOM NAME</label>
                <input id="setRoomName" class="control" value="${escapeHTML(room.name)}" />
            </div>

            <div class="wide field">
                <label>DESCRIPTION</label>
                <textarea id="setRoomDesc" class="control">${escapeHTML(room.description || "")}</textarea>
            </div>

            <div class="field">
                <label>STATUS</label>
                <select id="setRoomActive" class="control">
                    <option value="true" ${room.active ? "selected" : ""}>Open</option>
                    <option value="false" ${!room.active ? "selected" : ""}>Closed</option>
                </select>
            </div>

            <div class="field">
                <label>VISIBILITY</label>
                <select id="setRoomVisibility" class="control">
                    <option value="private" ${room.visibility !== "open" ? "selected" : ""}>Code Required</option>
                    <option value="open" ${room.visibility === "open" ? "selected" : ""}>Open</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="saveRoomSettings('${room.id}')">Save Room Settings</button>
            <button class="btn btn-secondary" onclick="copyRoomCode('${room.code}')">Copy Code</button>
            <button class="btn btn-danger" onclick="deleteRoom('${room.id}')">Delete Room</button>
        </div>
    `;
}

async function saveRoomSettings(roomId) {
    const room = await sbMaybeSingle("rooms", q => q.eq("id", roomId));
    if (!room) return;

    const patch = {
        name: $("#setRoomName").value.trim(),
        description: $("#setRoomDesc").value.trim(),
        active: $("#setRoomActive").value === "true",
        visibility: $("#setRoomVisibility").value,
        updated_at: now()
    };

    const { error } = await sbUpdate("rooms", patch, q => q.eq("id", roomId));
    if (error) return toast(error.message);

    await sbInsert("audit", {
        id: uid("audit"),
        user_id: currentUser.id,
        action: "ROOM_UPDATED",
        detail: patch.name,
        created_at: now(),
        room_id: roomId
    });

    toast("Room settings saved.");
    openRoom(roomId);
}

async function deleteRoom(roomId) {
    const room = await sbMaybeSingle("rooms", q => q.eq("id", roomId));
    if (!room) return;

    if (!confirm(`Delete "${room.name}"? This cannot be undone.`)) return;

    await sbDelete("room_members", q => q.eq("room_id", roomId));
    await sbDelete("attendance", q => q.eq("room_id", roomId));
    await sbDelete("requests", q => q.eq("room_id", roomId));
    await sbDelete("notifications", q => q.eq("room_id", roomId));
    await sbDelete("audit", q => q.eq("room_id", roomId));
    const { error } = await sbDelete("rooms", q => q.eq("id", roomId));
    if (error) return toast(error.message);

    toast("Room deleted.");
    go("rooms");
}
